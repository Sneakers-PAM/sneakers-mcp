# Code-quality gate: complexity down, dead code pruned. golangci-lint v2.
version: "2"
linters:
  enable:
    - gocyclo      # cyclomatic complexity
    - gocognit     # cognitive complexity
    - staticcheck
    - unused       # provably-dead symbols
    - govet
    - ineffassign
    - errcheck
  settings:
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
